# coturn TURN server configuration
# https://github.com/coturn/coturn/wiki/turnserver

# Listening IP and port
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Relay IP — advertised to clients as the TURN candidate address
# Coturn binds to 0.0.0.0 but tells clients to use this IP for relay
relay-ip=0.0.0.0
external-ip=10.81.20.67

# Relay port range (match the docker-compose port mapping)
min-port=49160
max-port=49200

# Authentication
realm=remote-agent.local
# NO static user.
#
# A permanent username/password had to be handed to every client, and the relay
# served it to anonymous callers at /session/ice-servers — so anyone who fetched
# one URL got unlimited relay bandwidth, and rotating it meant redeploying every
# client. Replaced by the REST-API scheme below.
# user=agent:changeme_in_prod

# Logging
# Use syslog so we can see coturn logs via docker logs
log-file=stdout
verbose
syslog
stunnel disabled
no-tls-v1x
no-tlsv1
no-tlsv1_1
no-tlsv1_2

# Fingerprint for STUN messages
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Deny relay to loopback / private ranges for security
no-loopback-peers
no-multicast-peers
no-multicast-peers

# Enable REST API for dynamic credentials (optional)
# REST-API credentials: the relay derives "<expiry>:<id>" + HMAC-SHA1 from this
# same secret, and coturn recomputes the HMAC to verify. No shared state, and an
# issued credential expires on its own.
#
# The secret MUST match the relay's turn.auth_secret (or TURN_AUTH_SECRET).
# Generate one with: openssl rand -hex 32
use-auth-secret
static-auth-secret=CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_HEX_32
