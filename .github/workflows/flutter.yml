name: Build Flutter Desktop App

on:
  push:
    branches: [main]
    tags:
      - 'flutter-v*.*.*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Must provide Dart >= 3.10 (see neev_remote/pubspec.yaml).
  FLUTTER_VERSION: '3.38.5'
  # Signaling-server URL baked into every installer so installs auto-connect to
  # the deployment server (no first-run prompt, no stale IP). Change this to the
  # server you serve the installers from. Leave EMPTY to ask on first run.
  RELAY_URL: 'ws://172.17.17.77:8080/ws'

jobs:
  # ---- Native desktop packages: installer + portable, built on each OS ----
  build-desktop:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: macos-14
            platform: macos
          - os: windows-latest
            platform: windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # Cache only the immutable package downloads. Caching .dart_tool/ causes
      # a stale "build/native_assets/<os> not found" install failure on reruns.
      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pubcache-${{ hashFiles('neev_remote/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pubcache-

      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libx11-dev libxtst-dev zip

      - name: Install Inno Setup (Windows installer)
        if: matrix.platform == 'windows'
        run: choco install innosetup -y

      # ---- Go transport/worker host (Windows only): the seamless user-switch
      # backend (TransportMode). Built here so build_windows.ps1 can bundle
      # neev-host.exe into the installer. Mirrors agent-windows.yml (CGO + the
      # bundled static libvpx). ----
      - name: Set up Go (Windows)
        if: matrix.platform == 'windows'
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Install MSYS2 (mingw gcc for CGO, Windows)
        if: matrix.platform == 'windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-x86_64-gcc

      - name: Build Go host (neev-host.exe)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: amd64
        run: |
          $gcc = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "mingw64\bin\gcc.exe"
          if (!(Test-Path $gcc)) { throw "gcc not found at $gcc" }
          $env:CC = $gcc
          go mod tidy
          go build -v -o neev-host.exe ./agent
          Get-Item neev-host.exe | Select-Object Name,Length

      # ---- Go transport/worker host (macOS): the same TransportMode backend as
      # Windows, cross-built for darwin so build_macos.sh can bundle neev-agent +
      # the launchd plists for the switch-user/lock-screen daemon. CGO links the
      # brew-provided encoder libs (ffmpeg/x264/libvpx) via pkg-config. ----
      - name: Set up Go (macOS)
        if: matrix.platform == 'macos'
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Install macOS Go host deps (brew)
        if: matrix.platform == 'macos'
        run: brew install ffmpeg x264 libvpx pkg-config

      - name: Build Go host (neev-agent, macOS)
        if: matrix.platform == 'macos'
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: arm64
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix ffmpeg)/lib/pkgconfig:$(brew --prefix x264)/lib/pkgconfig:$(brew --prefix libvpx)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          go mod tidy
          go build -v -o neev-agent ./agent
          file neev-agent && ls -la neev-agent

      - name: flutter pub get
        run: cd neev_remote && flutter pub get

      - name: Build + package (Linux)
        if: matrix.platform == 'linux'
        run: bash neev_remote/packaging/build_linux.sh

      # Import the code-signing key so the macOS build has a STABLE identity.
      #
      # Without it, builds are ad-hoc signed and every update invalidates the
      # machine's Screen Recording grant — the entry still shows as enabled
      # while no longer applying, and the host silently captures nothing.
      #
      # Absent secret is NOT an error: forks cannot read repository secrets, and
      # a fork producing an unsigned-but-working build is better than a failed
      # one. Those builds simply inherit the per-update re-grant.
      - name: Import macOS signing key
        if: matrix.platform == 'macos'
        id: signing
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "no signing secret configured — builds will be ad-hoc signed"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/neev-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          # Also export the public certificate, for the trust step below.
          openssl pkcs12 -legacy -in "$RUNNER_TEMP/signing.p12" -clcerts -nokeys \
            -passin "pass:$P12_PASSWORD" -out "$RUNNER_TEMP/signing.cer" >/dev/null 2>&1 || true
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a GUI prompt that no runner can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/signing.p12"
          # Trust the certificate inside this throwaway keychain. Without it
          # `find-identity -v` lists nothing: a self-signed certificate is not
          # trusted by default, and -v shows only valid identities. Failure is
          # tolerated because the hash lookup below does not depend on trust.
          security add-trusted-cert -r trustRoot -p codeSign -k "$KEYCHAIN" \
            "$RUNNER_TEMP/signing.cer" >/dev/null 2>&1 || true

          # Read the SHA-1 straight off the certificate rather than via
          # find-identity. It is the same value codesign accepts as an identity
          # AND the leaf hash the designated requirement needs, and it is
          # available whether or not the certificate is trusted.
          IDENTITY="$(security find-certificate -a -Z "$KEYCHAIN" \
            | awk '/SHA-1 hash:/ {print $3; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::signing key imported but no certificate hash found"
            security find-certificate -a "$KEYCHAIN" | head -20
            exit 1
          fi
          rm -f "$RUNNER_TEMP/signing.cer"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          echo "signing identity ready"

      - name: Build + package (macOS)
        if: matrix.platform == 'macos'
        env:
          NEEV_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          NEEV_SIGN_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: bash neev_remote/packaging/build_macos.sh

      - name: Build + package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          ./neev_remote/packaging/build_windows.ps1

      - name: Upload packages
        uses: actions/upload-artifact@v4
        continue-on-error: true   # artifact storage quota may be hit; non-fatal
        with:
          name: neev-remote-${{ matrix.platform }}
          path: neev_remote/dist/*
          retention-days: 2

      # Artifact-quota workaround: also publish the desktop installers to a
      # rolling prerelease (release assets don't count against the artifact
      # storage quota), so they're always downloadable even when artifacts fail.
      - name: Publish installer to CI release
        if: matrix.platform != 'web'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ matrix.platform }}
          prerelease: true
          name: CI ${{ matrix.platform }} latest
          files: neev_remote/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Web package (static site) ----
  build-web:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: cd neev_remote && flutter pub get
      - run: bash neev_remote/packaging/build_web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: neev-remote-web
          path: neev_remote/dist/NeevRemote-web.zip
          retention-days: 2

  # ---- Publish a GitHub Release on flutter-v* tags ----
  release-flutter:
    needs: [build-desktop, build-web]
    if: startsWith(github.ref, 'refs/tags/flutter-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.pkg' -o -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp {} release/ \;
          ls -la release/
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Auto-prune CI artifacts older than 3 days. Old per-run artifacts are dead
  # weight (installers live on the portal + rolling ci-windows/ci-macos
  # releases); unchecked buildup hit the storage cap and blocked CI billing
  # once (2026-07-07, ~4GB) and reached 5.17GB again by 2026-07-30.
  cleanup-artifacts:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete artifacts older than 3 days
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 3 * 24 * 60 * 60 * 1000;
            let deleted = 0;
            for (let page = 1; page <= 10; page++) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                per_page: 100, page });
              const old = data.artifacts.filter(a => new Date(a.created_at).getTime() < cutoff);
              for (const a of old) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner, repo: context.repo.repo,
                    artifact_id: a.id });
                  deleted++;
                } catch (e) { /* already gone / race — ignore */ }
              }
              if (data.artifacts.length < 100) break;
            }
            core.info(`Deleted ${deleted} artifacts older than 3 days`);
